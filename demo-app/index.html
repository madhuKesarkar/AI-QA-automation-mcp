<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo App — QA Framework Dry Run</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  .hidden { display: none; }
  input { display: block; margin: 8px 0; padding: 6px; width: 100%; box-sizing: border-box; }
  button { padding: 6px 14px; cursor: pointer; }
  .error { color: #b00020; font-size: 0.9em; }
  ul { padding-left: 20px; }
  li.done { text-decoration: line-through; color: #888; }
  [data-testid="toast-success"] { background: #e6f4ea; color: #1e7e34; padding: 8px; margin-top: 8px; }
</style>
</head>
<body>

  <section id="login-screen">
    <h1>Sign in</h1>
    <label for="email">Email</label>
    <input id="email" data-testid="email-input" type="text" />
    <label for="password">Password</label>
    <input id="password" data-testid="password-input" type="password" />
    <button id="login-btn" data-testid="login-button">Log in</button>
    <p id="login-error" class="error hidden" data-testid="login-error"></p>
  </section>

  <section id="app-screen" class="hidden">
    <h1>My todos</h1>
    <input id="todo-input" data-testid="todo-input" placeholder="Add a todo" />
    <button id="add-btn" data-testid="add-todo-button">Add</button>
    <p id="add-error" class="error hidden" data-testid="add-todo-error"></p>
    <ul id="todo-list" data-testid="todo-list"></ul>
    <p id="toast" class="hidden" data-testid="toast-success">Todo added!</p>
  </section>

<script>
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  loginBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      loginError.textContent = 'Email and password are required';
      loginError.classList.remove('hidden');
      return;
    }
    if (password !== 'password123') {
      loginError.textContent = 'Invalid credentials';
      loginError.classList.remove('hidden');
      return;
    }
    loginError.classList.add('hidden');
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
  });

  const todoInput = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const addError = document.getElementById('add-error');
  const todoList = document.getElementById('todo-list');
  const toast = document.getElementById('toast');

  addBtn.addEventListener('click', () => {
    const text = todoInput.value.trim();
    if (!text) {
      addError.textContent = 'Todo text cannot be empty';
      addError.classList.remove('hidden');
      return;
    }
    addError.classList.add('hidden');
    const li = document.createElement('li');
    li.textContent = text;
    li.dataset.testid = 'todo-item';
    li.addEventListener('click', () => li.classList.toggle('done'));
    todoList.appendChild(li);
    todoInput.value = '';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 1500);
  });
</script>
</body>
</html>
